{# The tab buttons: server-owned selection via aria-current. Shared by the
   page (inside the nav) and the region response (out of band, so a filter
   change keeps the band's nav in sync with the swapped content). #}
<div role="group">
    <button type="button"
            data-tab="overview"
            {% if tab == 'overview' %}aria-current="true"{% endif %}>Overview</button>
    {% for entry in groups %}
        <button type="button"
                data-tab="{{ entry.group.id }}"
                {% if tab == entry.group.id %}aria-current="true"{% endif %}>{{ entry.group.label }}</button>
    {% endfor %}
</div>
